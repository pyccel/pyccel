name: 'Pyccel pytest commands generating fortran or c'
inputs:
  shell_cmd:
    description: 'Specifies the shell command (different for anaconda)'
    required: false
    default: 'bash'
  pytest_mark:
    description: 'Mark expression to exclude additional tests'
    required: false
    default: ''


runs:
  using: "composite"
  steps:
    - name: Set up runner
      run: |
        which python
        if [ -n "${{ runner.debug }}" ]
        then
          # If running in debug mode
          echo "DEBUG=1" >> $GITHUB_ENV
          export FLAGS="-xsv --log-cli-level DEBUG"
        else
          export FLAGS=""
        fi
        echo "FLAGS=${FLAGS}" >> $GITHUB_ENV
      shell: ${{ inputs.shell_cmd }}
      working-directory: ./tests
    - name: Setup debug state
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "PYCCEL_DEBUG_MODE=1" >> $GITHUB_ENV
      shell: ${{ inputs.shell_cmd }}
      working-directory: ./tests
    - name: Test translation with uninstalled STC
      run: |
        python -m pytest -rX ${FLAGS} -m c epyccel/test_epyccel_lists.py::test_pop_last_element 2>&1 | tee install_outfile.out
        python -m pytest -rX ${FLAGS} -m fortran epyccel/test_epyccel_lists.py::test_pop_last_element 2>&1 | tee -a install_outfile.out
        python -m pytest -rX ${FLAGS} pyccel/test_pyccel.py::test_json_register 2>&1 | tee -a install_outfile.out
        # Test STC update
        if [ -n "${SITE_DIR}" ]; then
          touch ${SITE_DIR}/pyccel/extensions/STC
          python -m pytest -rX ${FLAGS} -m c epyccel/test_epyccel_lists.py::test_pop_last_element 2>&1 | tee -a install_outfile.out
         fi
      shell: ${{ inputs.shell_cmd }}
      working-directory: ./tests
      id: pytest_dependencies
    - name: Test folder update
      run: |
         if [ -n "${SITE_DIR}" ]; then
            echo "Touching"
            # Test ndarray folder update (requires parallel tests to avoid clean)
            printf "\n\n" >> ${SITE_DIR}/pyccel/stdlib/cwrapper/cwrapper.h
            python -m pytest -n auto -rX ${FLAGS} -m c -k test_array_int32_1d_scalar test_arrays.py 2>&1 | tee stdlib_update_outfile.out
         fi
      shell: ${{ inputs.shell_cmd }}
      working-directory: ./tests/epyccel
      id: pytest_stdlib_update
    - name: Install STC and gFTL
      run: |
        # Install STC so it can be discovered
        meson setup build --buildtype release --prefix ~/.local
        meson compile -C build
        meson install -C build 2>&1 | tee install_info.txt
        export PKG_CONFIG_PATH=${PKG_CONFIG_PATH}:$(grep "\.pc" install_info.txt | cut -d ' ' -f 4-)
        echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> $GITHUB_ENV
        export cmake_folders=$(dirname $(find ${SITE_DIR}/pyccel/ -name '*.cmake') | sort -u)
        to_append=$(echo "${cmake_folders}" | paste -sd ":" -)
        export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}:${to_append}"
        echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}" >> $GITHUB_ENV
      shell: ${{ inputs.shell_cmd }}
      working-directory: ./pyccel/extensions/STC
    - name: Test
      run: python -m pytest -n auto -rX ${FLAGS} -m "not (parallel or xdist_incompatible) ${{ inputs.pytest_mark }}" 2>&1 | tee outfile.out
      shell: ${{ inputs.shell_cmd }}
      working-directory: ./tests
      id: pytest
    - name: Test multi-file translations
      run: |
         python -m pytest -rX ${FLAGS} -m "xdist_incompatible and not parallel ${{ inputs.pytest_mark }}" 2>&1 | tee xdist_incompatible_outfile.out
         pyccel clean -s
      shell: ${{ inputs.shell_cmd }}
      working-directory: ./tests
      id: pytest_xdist_incompatible
    - name: Final step
      if: always()
      id: status
      run:
        python ci_tools/json_pytest_output.py -t "Linux Test Summary" --tests \
                       "Language-agnostic tests:${{ steps.pytest_language_agnostic.outcome }}:tests/lang_outfile.out" \
                       "Tests with STC/gFTL uninstalled:${{ steps.pytest_dependencies.outcome }}:tests/install_outfile.out" \
                       "Verification of stdlib update:${{ steps.pytest_stdlib_update.outcome }}:tests/stdlib_update_outfile.out" \
                       "Tests:${{ steps.pytest.outcome }}:tests/outfile.out" \
                       "Non-parallelisable tests:${{ steps.pytest_xdist_incompatible.outcome }}:tests/xdist_incompatible_outfile.out" \
                      
      shell: ${{ inputs.shell_cmd }}

